name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          cache: true

      - name: Enable native assets (required by flutter_scene)
        # flutter_scene converts .glb models and builds materials at build
        # time via Dart's experimental Native Assets feature (see
        # https://fscene.dev/api/flutter_scene/latest/). That feature is
        # OFF by default and is a one-time `flutter config` setting on the
        # machine doing the build -- but this workflow provisions a brand
        # new runner on every run, so without this step the setting was
        # never made and the build hook that produces real, drawable 3D
        # content silently never ran. The APK still built and launched
        # (nothing about that failure throws a catchable Dart exception),
        # it just had no renderable scene content, which is exactly the
        # "engine starts fine, nothing draws" symptom being debugged.
        run: |
          flutter config --enable-native-assets
          flutter config --enable-dart-data-assets

      - name: Flutter version
        run: |
          flutter --version
          flutter doctor -v

      - name: Get dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Analyze
        run: dart analyze lib || true

      - name: Build APK
        run: flutter build apk --release

      - name: Rename APK
        run: cp build/app/outputs/flutter-apk/app-release.apk anime-road-runner.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Anime Road Runner Build ${{ github.run_number }}
          body: |
            Anime Road Runner Android APK
            Automated release build.
          files: anime-road-runner.apk
          generate_release_notes: false